name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — this is a build-free static app.
      - name: i18n coverage guard
        run: node scripts/check-i18n.js

      - name: Unit tests (core logic)
        run: node --test
